name: Build and Release MediaLab Downloader (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build, sign and publish Windows update
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing helper
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Validate update signing key and derive public key
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY) -or $env:UPDATE_SIGNING_KEY -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'Missing or invalid UPDATE_SIGNING_KEY. Add a 32-byte Ed25519 seed as a 64-character hex GitHub Actions secret.'
          }
          @'
          import os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          seed = bytes.fromhex(os.environ["UPDATE_SIGNING_KEY"])
          key = Ed25519PrivateKey.from_private_bytes(seed)
          public = key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw).hex()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("MEDIALAB_UPDATE_PUBLIC_KEY=" + public + "\n")
          '@ | python -

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build application and browser host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MEDIALAB_UPDATE_REPO = $env:GITHUB_REPOSITORY
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Cargo build failed: $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Prepare installer files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build-cache\stage'
          New-Item -ItemType Directory -Force "$stage\tools", "$stage\extension", "$stage\extension-firefox", 'dist' | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\MediaLabDownloader.exe' $stage
          Copy-Item 'target\x86_64-pc-windows-msvc\release\medialab-host.exe' $stage
          Copy-Item 'THIRD-PARTY-NOTICES.txt' $stage
          Set-Content -Path "$stage\LICENSE.txt" -Value 'See THIRD-PARTY-NOTICES.txt and the source repository for license information.' -Encoding UTF8
          Copy-Item 'extension\*' "$stage\extension" -Recurse -Force
          Remove-Item "$stage\extension\test" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'extension\*' "$stage\extension-firefox" -Recurse -Force
          Remove-Item "$stage\extension-firefox\test" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$stage\extension-firefox\manifest.firefox.json" "$stage\extension-firefox\manifest.json" -Force
          Remove-Item "$stage\extension-firefox\manifest.firefox.json" -Force
          Remove-Item "$stage\extension\manifest.firefox.json" -Force -ErrorAction SilentlyContinue
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $version) { throw 'Could not read version from Cargo.toml' }
          "MEDIALAB_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc '/Q' "/DMyAppVersion=$env:MEDIALAB_VERSION" "/DStage=$env:GITHUB_WORKSPACE\build-cache\stage" 'installer\medialab.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'dist\MediaLab-Downloader-Setup.exe')) { throw 'Installer output was not created' }

      - name: Create signed version.json
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          version = os.environ["MEDIALAB_VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          setup = Path("dist/MediaLab-Downloader-Setup.exe")
          digest = hashlib.sha256(setup.read_bytes()).hexdigest()
          message = f"medialab-downloader-update\\n{version.strip()}\\n{digest.lower()}\\n".encode()
          key = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(os.environ["UPDATE_SIGNING_KEY"]))
          signature = key.sign(message).hex()
          tag = "v" + version
          data = {
              "version": version,
              "url": f"https://github.com/{repo}/releases/download/{tag}/MediaLab-Downloader-Setup.exe",
              "sha256": digest,
              "sig": signature
          }
          Path("dist/version.json").write_text(json.dumps(data, indent=2) + "\\n", encoding="utf-8")
          '@ | python -

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:MEDIALAB_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'dist/MediaLab-Downloader-Setup.exe' 'dist/version.json' --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update release assets' }
          } else {
            gh release create $tag 'dist/MediaLab-Downloader-Setup.exe' 'dist/version.json' --repo $env:GITHUB_REPOSITORY --title "MediaLab Downloader $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub Release' }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaLab-Downloader-Windows-${{ github.run_number }}
          path: |
            dist/MediaLab-Downloader-Setup.exe
            dist/version.json
          if-no-files-found: error
          retention-days: 30
